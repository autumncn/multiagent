# Model Capability Registry
# Maps LiteLLM aliases to capabilities
#
# Fixed node aliases (used by specific nodes):
#   router-fast      → Router node
#   judge-primary    → Judge node (final synthesis)
#   critic-primary   → Critic node (quality review)
#
# Dynamic expert aliases (matched by capability needs):
#   general-fast     → Fallback for simple tasks
#   technical-heavy  → Complex code/devops
#   technical-light  → Simple scripts
#   finance-heavy    → Financial analysis
#   research-heavy   → Deep research
#   creative-heavy   → Long-form writing
#   creative-light   → Short writing tasks
#
# LiteLLM model mapping:
#   router-fast        -> nvidia/nemotron-3-ultra-550b-a55b (FREE)
#   judge-primary      -> qwen3.7-max-tp
#   critic-primary     -> deepseek-v4-pro-tp
#   general-fast       -> nvidia/nemotron-3-ultra-550b-a55b (FREE)
#   reasoning-heavy    -> qwen3.7-max-tp
#   reasoning-light    -> nvidia/nemotron-3-ultra-550b-a55b (FREE)
#   technical-heavy    -> qwen3.7-plus-cp
#   technical-light    -> nvidia/nemotron-3-ultra-550b-a55b (FREE)
#   finance-heavy      -> deepseek-v4-pro-tp
#   research-heavy     -> qwen3.7-max-tp
#   creative-heavy     -> qwen3.7-max-tp
#   creative-light     -> nvidia/nemotron-3-ultra-550b-a55b (FREE)

aliases:
  # Fixed node aliases
  router-fast:
    capabilities: [routing, classification]
    description: "Free model for routing decisions"
    cost_tier: free
    fixed_node: router

  judge-primary:
    capabilities: [judge, synthesis, decision, complex_reasoning, final_answer]
    description: "Best model for final judgment and synthesis"
    cost_tier: premium
    fixed_node: judge

  critic-primary:
    capabilities: [criticism, logic, review, contradiction, quality_check]
    description: "Best model for critical review and quality assurance"
    cost_tier: mid
    fixed_node: critic

  # Dynamic expert aliases
  general-fast:
    capabilities: [general, qa, daily, travel, simple, greeting, chat, explain]
    description: "Free model for simple tasks and Q&A"
    cost_tier: free

  reasoning-heavy:
    capabilities: [logic, reasoning, analysis, deduction, inference, philosophy, mathematics, proof]
    description: "Best model for complex logical reasoning and analysis"
    cost_tier: premium

  reasoning-light:
    capabilities: [simple_logic, basic_reasoning, calculation, estimation]
    description: "Free model for simple logical tasks"
    cost_tier: free

  technical-heavy:
    capabilities: [code, devops, architecture, security, debugging, infrastructure, database, networking, docker, kubernetes, system_design]
    description: "Best model for complex engineering tasks"
    cost_tier: mid

  technical-light:
    capabilities: [script, simple_code, command, bash, config, shell, automation, cron, regex]
    description: "Free model for simple code tasks"
    cost_tier: free

  finance-heavy:
    capabilities: [finance, valuation, quant, market, portfolio, technical_analysis, stock, forex, options, bonds, crypto, macro_economics, risk_assessment, dividend, earnings, dcf]
    description: "Best model for financial analysis valuation and risk"
    cost_tier: mid

  research-heavy:
    capabilities: [research, long_context, report, analysis, industry, news, comparison, trend, academic, survey, synthesis, literature, benchmark, evaluation]
    description: "Best model for deep research and analysis"
    cost_tier: premium

  creative-heavy:
    capabilities: [writing, document, report, email, summarization, communication, content, blog, article, storytelling, copywriting, marketing, presentation]
    description: "Best model for long-form writing and communication"
    cost_tier: premium

  creative-light:
    capabilities: [brief, summary, rewrite, translation, editing, formatting, proofreading, rephrase]
    description: "Free model for short writing tasks"
    cost_tier: free
